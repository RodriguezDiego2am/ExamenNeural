name: Publicar buscador

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pymupdf
      - name: Extraer texto de los PDFs
        run: python tools/build_index.py
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Generar vectores de significado (solo si cambiaron los PDFs)
        run: |
          if ! git diff --quiet -- data/index.json || [ ! -f data/embeddings.bin ]; then
            npm install --no-save @huggingface/transformers@3.8.1 --onnxruntime-node-install-cuda=skip
            node tools/build_embeddings.mjs
          fi
      - name: Guardar índice en el repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --cached --quiet || (git commit -m "Actualizar índice de búsqueda" && git push)
      - name: Armar sitio
        run: |
          mkdir _site
          cp -r index.html app.js style.css vendor data pdfs _site/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deploy
        uses: actions/deploy-pages@v4
